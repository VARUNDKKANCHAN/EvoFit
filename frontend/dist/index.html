    <!-- 
      Anti-flash theme script: runs synchronously BEFORE React loads.
      Reads saved theme from localStorage, defaults to dark.
      Prevents white flash for dark mode users on page load.
    -->
    <script>
      (function() {
        var theme = localStorage.getItem('evofit-theme');
        // Default to dark mode if no preference saved
        if (!theme || theme === 'dark') {
          document.documentElement.classList.add('dark');
          if (!theme) localStorage.setItem('evofit-theme', 'dark');
        }
      })();
    </script>
